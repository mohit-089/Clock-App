<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

  <div class="app" id="mainApp">

    <div class="topbar">
      <div class="app-logo" id="aLogo">
        <i class="ti ti-clock" id="aLogoI"></i>
      </div>
      <span class="app-title-txt">Clock</span>
      <div class="theme-dots">
        <div class="tdot active" id="td0" onclick="setTheme(0)" title="Pearl"></div>
        <div class="tdot" id="td1" onclick="setTheme(1)" title="Obsidian"></div>
        <div class="tdot" id="td2" onclick="setTheme(2)" title="Forest"></div>
        <div class="tdot" id="td3" onclick="setTheme(3)" title="iOS"></div>
      </div>
    </div>

    <div class="nav">
      <button class="nb active" id="nb0" onclick="showTab(0)"><i class="ti ti-clock"></i><span>Clock</span></button>
      <button class="nb" id="nb1" onclick="showTab(1)"><i class="ti ti-alarm"></i><span>Alarm</span></button>
      <button class="nb" id="nb2" onclick="showTab(2)"><i class="ti ti-stopwatch"></i><span>Stopwatch</span></button>
      <button class="nb" id="nb3" onclick="showTab(3)"><i class="ti ti-hourglass"></i><span>Timer</span></button>
    </div>

    <div class="panels">

      <!-- CLOCK -->
      <div class="pnl active" id="p0">
        <div class="clock-wrap">
          <div class="clock-card">
            <div class="dial" id="dial">
              <div class="dial-ring"></div>
              <div id="tks"></div>
              <div id="hls"></div>
              <div class="hc" id="hH">
                <div id="hhd"></div>
              </div>
              <div class="hc" id="hM">
                <div id="hmd"></div>
              </div>
              <div class="hc" id="hS">
                <div id="hsd"></div>
              </div>
              <div class="cdot" id="cdt"></div>
              <div class="cdot2" id="cdt2"></div>
            </div>
            <div class="dline"></div>
            <div class="irow">
              <div class="dtxt" id="dtxt"></div>
              <div class="ddtxt" id="ddtxt"></div>
            </div>
          </div>

          <div class="wx-card" id="wxCard">
            <div class="wx-top">
              <span class="wx-loc">
                <i class="ti ti-map-pin"></i>
                <span id="wxLoc">Fetching location…</span>
              </span>
              <button class="wx-refresh" onclick="fetchWeather()" title="Refresh">
                <i class="ti ti-refresh"></i>
              </button>
            </div>
            <div id="wxBody">
              <div class="wx-loading">Loading weather…</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ALARM -->
      <div class="pnl" id="p1">
        <div class="alarm-wrap">
          <div class="alm-hdr">
            <span class="alm-hdr-txt">Alarms</span>
            <button class="add-btn-top" onclick="openModal(-1)" aria-label="Add alarm">
              <i class="ti ti-plus"></i>
            </button>
          </div>
          <div id="almList"></div>
          <button class="add-alm-btn" onclick="openModal(-1)">
            <i class="ti ti-plus"></i> New Alarm
          </button>
        </div>
      </div>

      <!-- STOPWATCH -->
      <div class="pnl" id="p2">
        <div class="sw-disp" id="swD">00:<span>00</span><span class="swms">.<span>00</span></span></div>
        <div class="sw-btns">
          <button class="swb sec-btn" id="swLapB" onclick="swLap()">Lap</button>
          <button class="swb pri-btn" id="swPlayB" onclick="swToggle()">
            <i class="ti ti-player-play" id="swIco"></i>
          </button>
          <button class="swb sec-btn" onclick="swReset()">
            <i class="ti ti-rotate-clockwise"></i>
          </button>
        </div>
        <div class="lap-list" id="lapL"></div>
      </div>

      <!-- TIMER -->
      <div class="pnl" id="p3">
        <div class="t-presets">
          <button class="tpbtn" onclick="setTimer(60)">1 min</button>
          <button class="tpbtn" onclick="setTimer(180)">3 min</button>
          <button class="tpbtn" onclick="setTimer(300)">5 min</button>
          <button class="tpbtn" onclick="setTimer(600)">10 min</button>
          <button class="tpbtn" onclick="setTimer(900)">15 min</button>
          <button class="tpbtn" onclick="setTimer(1800)">30 min</button>
          <button class="tpbtn" onclick="setTimer(3600)">60 min</button>
        </div>

        <div class="t-custom">
          <input type="number" id="customTime" placeholder="Enter minutes" min="1">
          <button class="tpbtn" onclick="setCustomTimer()">Set Timer</button>
        </div>
      
        <div class="t-arc">
          <svg width="170" height="170" viewBox="0 0 170 170">
            <circle cx="85" cy="85" r="75" fill="none" stroke-width="5" id="tarcBg" />
            <circle cx="85" cy="85" r="75" fill="none" stroke-width="5" stroke-linecap="round" id="tarcFg" />
          </svg>
          <div class="t-ctr" id="tCtr">05:00</div>
        </div>
        <div class="t-sub" id="tSub">READY</div>
        <div class="t-btns">
          <button class="swb pri-btn" id="tPlayB" onclick="tmrToggle()">
            <i class="ti ti-player-play" id="tIco"></i>
          </button>
          <button class="swb sec-btn" onclick="tmrReset()">
            <i class="ti ti-rotate-clockwise"></i>
          </button>
        </div>
      </div>

    </div><!-- /panels -->

    <!-- ALARM MODAL -->
    <div class="modal-bg" id="modalBg" onclick="closeMBg(event)">
      <div class="modal-sheet" id="mSheet">
        <div class="mhandle"></div>
        <div class="mtitle" id="mTitle">New Alarm</div>
        <div class="mrow">
          <span class="mlbl"><i class="ti ti-clock"></i>Time</span>
          <input class="minput" id="mTime" type="time" value="08:00">
        </div>
        <div class="mrow">
          <span class="mlbl"><i class="ti ti-tag"></i>Label</span>
          <input class="minput" id="mLbl" type="text" placeholder="Alarm" maxlength="20">
        </div>
        <div class="mrow clickable" onclick="openPicker('sound')">
          <span class="mlbl"><i class="ti ti-music"></i>Sound</span>
          <span class="mval" id="mSoundV">Radar <i class="ti ti-chevron-right"></i></span>
        </div>
        <div class="mrow clickable" onclick="openPicker('snooze')">
          <span class="mlbl"><i class="ti ti-zzz"></i>Snooze</span>
          <span class="mval" id="mSnoozeV">5 min <i class="ti ti-chevron-right"></i></span>
        </div>
        <div class="mrow clickable" onclick="openPicker('repeat')">
          <span class="mlbl"><i class="ti ti-repeat"></i>Repeat</span>
          <span class="mval" id="mRepeatV">Never <i class="ti ti-chevron-right"></i></span>
        </div>
        <div class="mbtns">
          <button class="mbtn cancel-btn" onclick="closeModal()">Cancel</button>
          <button class="mbtn save-btn" id="mSavBtn" onclick="saveAlarm()">Save</button>
        </div>
      </div>
    </div>

    <!-- OPTION PICKER -->
    <div class="picker-bg" id="pickerBg" onclick="closePBg(event)">
      <div class="picker-box" id="pickerBox"></div>
    </div>

  </div><!-- /app -->

  <script src="script.js"></script>
</body>

</html>
